[project]
name = "siftarr"
dynamic = ["version"]
description = "Media search and download decision middleware"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "sqlalchemy[asyncio]>=2.0.49",
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "qbittorrent-api>=2026.5.1",
    "apscheduler>=3.11.2",
    "pydantic>=2.13.4",
    "itsdangerous>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.12",
    "ty>=0.0.29",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "app/siftarr/_version.py"

[tool.hatch.build.targets.wheel]
only-include = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
  "-q",
  "--tb=short",
  "--disable-warnings",
  "--no-header",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]  # E501: Line too long, B008: Do not perform function calls in argument defaults

[tool.ruff.lint.isort]
known-first-party = ["app", "siftarr"]
