name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  quality:
    name: Quality (Lint, Format, Typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run linter
        run: uv run ruff check .

      - name: Run formatter
        run: uv run ruff format --check --diff

      - name: Run type checker
        run: uv run ty check

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Set up database
        run: mkdir -p data/db && cd db && SIFTARR_DB_PATH=../data/db/siftarr.db uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest --cov=app --cov-report=xml

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          build-args: |
            SIFTARR_VERSION=0.0.0

  commit-author:
    name: Commit author policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Require commits attributed to siftarrdev
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          commit_count=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.commits')
          if [ "$commit_count" -gt 250 ]; then
            echo "Cannot validate all $commit_count commits; split this PR into smaller PRs."
            exit 1
          fi

          invalid_commits=$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/commits" \
            --jq '.[] | select(.author.login != "siftarrdev") | "\(.sha) \(.author.login // "unlinked GitHub identity")"')

          if [ -n "$invalid_commits" ]; then
            echo "Only commits attributed to siftarrdev are permitted."
            echo "$invalid_commits"
            exit 1
          fi
