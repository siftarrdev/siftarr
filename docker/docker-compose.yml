services:
  siftarr:
    image: siftarr:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SIFTARR_VERSION: ${SIFTARR_VERSION:-0.0.0}
    container_name: siftarr
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SIFTARR_DEFAULT_RULES_PATH: /data/config/rules.json
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      # Optional first-run rule seed file. Create docker/siftarr-rules.json
      # from Rules → Export. Seed path is configured above.
      - ./siftarr-rules.json:/data/config/rules.json:ro
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
