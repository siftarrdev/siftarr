{% extends "base.html" %}

{% block title %}Staging Decision Log - Siftarr{% endblock %}

{% block content %}
<div class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
    <div>
        <p class="text-sm font-medium text-brand-300">Rules</p>
        <h1 class="text-3xl font-bold text-white">Staging Decision Log</h1>
        <p class="mt-1 text-sm text-gray-400">Review staging decisions to fine-tune rules.</p>
    </div>
    <div class="flex gap-2" aria-label="Rules subsections">
        <a href="/rules" class="btn-ghost">Rules</a>
        <a href="/rules/decision-log" class="btn-primary">Decision Log</a>
    </div>
</div>

<section class="rounded-2xl border border-gray-800 bg-surface-850 p-4 shadow-xl">
    <form id="decision-log-filters" class="grid grid-cols-1 gap-3 md:grid-cols-3 lg:grid-cols-6">
        <label class="text-sm text-gray-300">From<input name="date_from" type="datetime-local" class="form-input mt-1"></label>
        <label class="text-sm text-gray-300">To<input name="date_to" type="datetime-local" class="form-input mt-1"></label>
        <label class="text-sm text-gray-300">Title<input name="title" type="search" class="form-input mt-1" placeholder="Title"></label>
        <label class="text-sm text-gray-300">Media<select name="media_type" class="form-select mt-1"><option value="">Any</option><option value="movie">Movie</option><option value="tv">TV</option></select></label>
        <label class="text-sm text-gray-300">Event<input name="event_type" class="form-input mt-1" placeholder="rule_accept"></label>
        <label class="text-sm text-gray-300">Outcome<input name="outcome" class="form-input mt-1" placeholder="staged"></label>
        <label class="text-sm text-gray-300">Selection<select name="selection_source" class="form-select mt-1"><option value="">Any</option><option value="rule">Rule</option><option value="manual">Manual</option></select></label>
        <div class="flex items-end gap-2 lg:col-span-5"><button type="submit" class="btn-primary">Apply</button><button type="button" id="decision-log-reset" class="btn-ghost">Reset</button></div>
    </form>
</section>

<section class="mt-5 rounded-2xl border border-gray-800 bg-surface-850 p-4 shadow-xl">
    <div class="mb-3 flex items-center justify-between gap-3">
        <p id="decision-log-status" class="text-sm text-gray-400">Loading…</p>
        <div class="flex items-center gap-2"><button id="decision-log-prev" class="btn-ghost" type="button">Previous</button><button id="decision-log-next" class="btn-ghost" type="button">Next</button></div>
    </div>
    <div id="decision-log-results" class="space-y-3"></div>
</section>

<script src="/static/js/staging_decision_log.js?v={{ static_version }}"></script>
{% endblock %}
